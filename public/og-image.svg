<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A2A" />
      <stop offset="45%" stop-color="#1B1244" />
      <stop offset="100%" stop-color="#2D1573" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Background Ambient Glows -->
  <circle cx="1050" cy="120" r="320" fill="#6B2CF5" opacity="0.25" filter="blur(80px)" />
  <circle cx="150" cy="520" r="280" fill="#EC4899" opacity="0.18" filter="blur(90px)" />

  <!-- Grid Decorative Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Header Brand Bar -->
  <g transform="translate(80, 70)">
    <!-- Brand Icon -->
    <rect width="52" height="52" rx="14" fill="#6B2CF5" filter="url(#dropShadow)" />
    <path d="M42 22v10M12 22l15-7 15 7-15 7z M18 25v7c4 4 12 4 15 0v-7" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Brand Name -->
    <text x="68" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5px">FindMy<tspan fill="#A855F7">B</tspan>School</text>
    
    <!-- Verified Badge -->
    <rect x="360" y="8" width="220" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.2" />
    <text x="382" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34D399">✓ 100% AUDITED METRICS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 210)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" line-height="1.15">
      India’s Transparent MBA &amp;
    </text>
    <text x="0" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#accentGradient)">
      PGDM Admissions Portal
    </text>
    <text x="0" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">
      600+ B-Schools • Audited Tuition Fees • Real CAT/XAT Cutoffs • CBT Mock Tests
    </text>
  </g>

  <!-- 4 Feature Cards Row -->
  <g transform="translate(80, 420)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="130" rx="16" fill="url(#cardGlow)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">600+ Verified</text>
      <text x="24" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">Colleges &amp; Universities</text>
      <text x="24" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#A855F7">0% Automated Scrapers →</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(265, 0)">
      <rect width="240" height="130" rx="16" fill="url(#cardGlow)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#38BDF8">CAT Predictor</text>
      <text x="24" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">Digialm Normalization</text>
      <text x="24" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#38BDF8">21 IIMs Call Forecasts →</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(530, 0)">
      <rect width="240" height="130" rx="16" fill="url(#cardGlow)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#34D399">₹25L Grants</text>
      <text x="24" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">14+ Live Scholarships</text>
      <text x="24" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#34D399">Free Mentorship →</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(795, 0)">
      <rect width="240" height="130" rx="16" fill="url(#cardGlow)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#F472B6">Free Mocks</text>
      <text x="24" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">TCS iON CBT Engine</text>
      <text x="24" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#F472B6">CAT, XAT, NMAT, SNAP →</text>
    </g>
  </g>

  <!-- Footer Domain Badge -->
  <text x="1120" y="590" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#64748B">
    findmybschool.com
  </text>
</svg>
